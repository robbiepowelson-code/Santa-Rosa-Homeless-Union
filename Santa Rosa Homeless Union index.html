ackground:#e2dcc9; border:2px solid #17140f; margin:0 0 6px;\">\n      <div style=\"height:100%; background:#f5c518; width:{{ flowPct }};\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#17140f; margin-bottom:22px;\">{{ flowStepName }}<\u002Fdiv>\n\n    <sc-if value=\"{{ flowShowPerson }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:3px solid #17140f; background:#fdf3cf; padding:11px 14px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;\">\n      <span style=\"font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; color:#17140f;\">Filing as {{ flowPersonSummary }} — prefilled from before.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ flowClearPerson }}\" style=\"cursor:pointer; border:2px solid #17140f; background:none; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:6px 11px; color:#17140f;\">Not me / clear<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFlowForm }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex; flex-direction:column; gap:20px;\">\n      <sc-for list=\"{{ flowFields }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <sc-if value=\"{{ f.showLabel }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#40382c;\">{{ f.label }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ false }}\">\n            <input type=\"text\" name=\"{{ f.name }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ onFlow }}\" placeholder=\"{{ f.placeholder }}\" style=\"border:3px solid #17140f; background:#fff; padding:13px 14px; font-size:16px;\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isTextarea }}\" hint-placeholder-val=\"{{ false }}\">\n            <textarea name=\"{{ f.name }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ onFlow }}\" rows=\"4\" placeholder=\"{{ f.placeholder }}\" style=\"border:3px solid #17140f; background:#fff; padding:13px 14px; font-size:16px; line-height:1.5;\"><\u002Ftextarea>\n            <button sc-camel-on-click=\"{{ f.onVoice }}\" style=\"align-self:flex-start; cursor:pointer; border:2px solid #17140f; background:#fff; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:7px 12px; display:flex; gap:8px; align-items:center;\"><span style=\"color:#17140f;\">●<\u002Fspan> Record instead of typing<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-raw-select name=\"{{ f.name }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ onFlow }}\" style=\"border:3px solid #17140f; background:#fff; padding:13px 14px; font-size:16px;\">\n              <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isRadio }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n              <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <label style=\"cursor:pointer; border:3px solid #17140f; padding:10px 15px; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.02em; background:{{ o.bg }}; color:{{ o.fg }};\">\n                  <input type=\"radio\" name=\"{{ o.name }}\" value=\"{{ o.value }}\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ onFlow }}\" style=\"display:none;\">{{ o.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isChecks }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px;\">\n              <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <label style=\"cursor:pointer; border:2px solid #17140f; padding:11px 13px; display:flex; gap:10px; align-items:center; font-size:14px; font-weight:600; background:{{ o.bg }};\">\n                  <input type=\"checkbox\" name=\"{{ o.name }}\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ onFlow }}\" style=\"width:18px; height:18px; accent-color:#17140f; flex:none;\">{{ o.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isCheck }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"cursor:pointer; border:3px solid #17140f; padding:14px 16px; display:flex; gap:12px; align-items:flex-start;\">\n              <input type=\"checkbox\" name=\"{{ f.name }}\" checked=\"{{ f.value }}\" sc-camel-on-change=\"{{ onFlow }}\" style=\"margin-top:2px; width:20px; height:20px; accent-color:#17140f; flex:none;\">\n              <span style=\"font-size:15px; line-height:1.5;\">{{ f.checkLabel }}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.hasHint }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:13px; color:#7a715c; font-family:'Space Mono',monospace; line-height:1.5;\">{{ f.hint }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFlowReview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex; flex-direction:column; gap:2px; border:3px solid #17140f; background:#17140f;\">\n      <sc-for list=\"{{ flowReview }}\" as=\"rv\" hint-placeholder-count=\"5\">\n        <div style=\"background:#f3efe4; padding:14px 18px; display:grid; grid-template-columns:200px 1fr; gap:14px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#17140f;\">{{ rv.k }}<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.5;\">{{ rv.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px; font-family:'Space Mono',monospace; font-size:13px; color:#4a4234; line-height:1.6;\">{{ flowReviewNote }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex; justify-content:space-between; gap:12px; margin-top:30px;\">\n      <button sc-camel-on-click=\"{{ flowPrev }}\" style=\"cursor:pointer; background:none; border:3px solid #17140f; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; font-size:15px; padding:13px 22px; color:#17140f; visibility:{{ flowPrevVis }};\">{{ uiBack }}<\u002Fbutton>\n      <sc-if value=\"{{ isFlowReview }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ flowSubmit }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:15px; padding:14px 26px; box-shadow:4px 4px 0 #17140f;\">{{ flowSubmitLabel }} →<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ flowNotLast }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ flowNext }}\" style=\"cursor:pointer; border:none; background:#17140f; color:#f3efe4; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:15px; padding:14px 26px;\">{{ uiContinue }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ FLOW DONE ============ -->\n  <sc-if value=\"{{ isFlowDone }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:620px; margin:0 auto; padding:60px 20px 90px; text-align:center;\">\n    <div style=\"display:inline-block; font-family:'Anton',sans-serif; text-transform:uppercase; color:#f3efe4; background:#3f6b3a; border:3px solid #17140f; padding:10px 18px; font-size:15px; letter-spacing:0.12em; transform:rotate(-4deg); box-shadow:4px 4px 0 #17140f;\">{{ doneStamp }}<\u002Fdiv>\n    <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(32px,6vw,54px); line-height:0.95; text-transform:uppercase; margin:24px 0 8px;\">{{ doneTitle }}<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; color:#40382c;\">{{ doneBody }}<\u002Fp>\n    <div style=\"border:3px solid #17140f; background:#17140f; color:#f3efe4; padding:22px; margin:24px 0; font-family:'Space Mono',monospace;\">\n      <div style=\"font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#f5c518;\">Your record number<\u002Fdiv>\n      <div style=\"font-family:'Anton',sans-serif; font-size:38px; letter-spacing:0.04em; margin-top:8px;\">{{ doneId }}<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer; border:none; background:#17140f; color:#f3efe4; font-weight:800; text-transform:uppercase; font-size:15px; padding:14px 24px;\">Back to home<\u002Fbutton>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ SWEEP MAP ============ -->\n  <sc-if value=\"{{ isSweepMap }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1240px; margin:0 auto; padding:34px 20px 80px;\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#17140f;\">Tool · Sweep map &amp; notice log<\u002Fdiv>\n        <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(30px,5vw,52px); line-height:0.95; text-transform:uppercase; margin:8px 0 0;\">Where the sweeps happen<\u002Fh1>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goReportSweep }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; font-size:14px; padding:12px 20px; box-shadow:3px 3px 0 #17140f;\">+ Report a sweep<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"max-width:680px; font-size:16px; line-height:1.55; color:#40382c; margin:16px 0 24px;\">Every logged sweep by encampment site. A red flag means the City removed property without the posted notice the settlement requires (§1(g)). Report one and it feeds the union record and cop-watch crew.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:2px; background:#17140f; border:3px solid #17140f;\">\n      <sc-for list=\"{{ sweepSites }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#f3efe4; padding:20px 20px; display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:10px;\">\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; line-height:1.1; text-transform:uppercase;\">{{ s.site }}<\u002Fdiv>\n            <div style=\"font-family:'Anton',sans-serif; font-size:34px; line-height:0.8; color:#17140f;\">{{ s.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ s.hasViolation }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; background:#f5c518; color:#17140f; padding:4px 8px; align-self:flex-start;\">⚑ {{ s.violations }} notice violation(s)<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s.compliantOnly }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; background:#bfe0ba; color:#254a20; padding:4px 8px; align-self:flex-start;\">Notice posted<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c;\">Last: {{ s.last }}<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.45; color:#4a4234;\">{{ s.latestItems }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ SMALL CLAIMS ============ -->\n  <sc-if value=\"{{ isClaims }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1200px; margin:0 auto; padding:34px 20px 80px;\">\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#17140f;\">Tool · Small claims auto-generator<\u002Fdiv>\n    <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(30px,5vw,52px); line-height:0.95; text-transform:uppercase; margin:8px 0 6px;\">Sue the City for your property<\u002Fh1>\n    <p style=\"max-width:680px; font-size:16px; line-height:1.55; color:#40382c; margin:0 0 26px;\">When the City takes or trashes your property in a sweep, the settlement makes that unlawful. Fill this out and we generate a court-ready statement for a California small claims filing (SC-100). Save it to the union record so we can track it.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:minmax(280px,1fr) minmax(300px,1.1fr); gap:24px; align-items:start;\">\n      <div style=\"display:flex; flex-direction:column; gap:16px;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a715c;\">Your details<\u002Fdiv>\n        <input type=\"text\" name=\"name\" value=\"{{ claim.name }}\" sc-camel-on-change=\"{{ onClaim }}\" placeholder=\"Your full name (plaintiff)\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px;\">\n        <input type=\"text\" name=\"contact\" value=\"{{ claim.contact }}\" sc-camel-on-change=\"{{ onClaim }}\" placeholder=\"Phone or email to reach you\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px;\">\n        <input type=\"text\" name=\"incidentDate\" value=\"{{ claim.incidentDate }}\" sc-camel-on-change=\"{{ onClaim }}\" placeholder=\"Date the property was taken (e.g. Jul 3, 2026)\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px;\">\n        <input type=\"text\" name=\"location\" value=\"{{ claim.location }}\" sc-camel-on-change=\"{{ onClaim }}\" placeholder=\"Where it happened (encampment / cross streets)\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a715c; margin-top:4px;\">What was taken<\u002Fdiv>\n        <textarea name=\"items\" value=\"{{ claim.items }}\" sc-camel-on-change=\"{{ onClaim }}\" rows=\"3\" placeholder=\"List property taken or destroyed: tent, medications, ID, tools, bike…\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px; line-height:1.5;\"><\u002Ftextarea>\n        <button sc-camel-on-click=\"{{ voiceClaimItems }}\" style=\"align-self:flex-start; cursor:pointer; border:2px solid #17140f; background:#fff; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:7px 12px; display:flex; gap:8px; align-items:center;\"><span style=\"color:#17140f;\">●<\u002Fspan> Record instead of typing<\u002Fbutton>\n        <label style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#40382c;\">Amount you are claiming (USD, max $12,500)<\u002Fspan>\n          <input type=\"number\" name=\"amount\" value=\"{{ claim.amount }}\" sc-camel-on-change=\"{{ onClaim }}\" placeholder=\"e.g. 1850\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px;\">\n        <\u002Flabel>\n        <div>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a715c; margin-bottom:8px;\">Which settlement protection was violated?<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ claimBasisOpts }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <label style=\"cursor:pointer; border:3px solid #17140f; padding:11px 13px; display:flex; gap:10px; align-items:flex-start; background:{{ b.bg }};\">\n                <input type=\"checkbox\" name=\"{{ b.name }}\" checked=\"{{ b.checked }}\" sc-camel-on-change=\"{{ onClaim }}\" style=\"margin-top:2px; width:18px; height:18px; accent-color:#17140f;\">\n                <span><span style=\"font-weight:700; font-size:14px;\">{{ b.label }}<\u002Fspan> <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#17140f;\">{{ b.clause }}<\u002Fspan><\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <textarea name=\"narrative\" value=\"{{ claim.narrative }}\" sc-camel-on-change=\"{{ onClaim }}\" rows=\"4\" placeholder=\"In your words: what happened, did you get notice, was anything safekept, badge numbers…\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px; line-height:1.5;\"><\u002Ftextarea>\n        <button sc-camel-on-click=\"{{ voiceClaimNarrative }}\" style=\"align-self:flex-start; cursor:pointer; border:2px solid #17140f; background:#fff; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:7px 12px; display:flex; gap:8px; align-items:center;\"><span style=\"color:#17140f;\">●<\u002Fspan> Record instead of typing<\u002Fbutton>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ saveClaim }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:14px; padding:13px 20px; box-shadow:4px 4px 0 #17140f;\">Save to union record<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ downloadClaim }}\" style=\"cursor:pointer; background:none; border:3px solid #17140f; font-weight:700; text-transform:uppercase; font-size:14px; padding:11px 18px; color:#17140f;\">Download statement<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ claimSaved }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:3px solid #3f6b3a; background:#eaf3e8; padding:12px 14px; font-size:14px; font-weight:600; color:#254a20;\">✓ Saved as {{ claimSavedId }}. It now appears in the admin back end.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #17140f; background:#fffdf7; padding:30px 30px 36px; box-shadow:6px 6px 0 #17140f;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#7a715c; text-align:center; border-bottom:2px solid #17140f; padding-bottom:10px; margin-bottom:16px;\">Plaintiff's Claim · Small Claims (SC-100) · Draft<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.7; color:#17140f;\">\n          <div><strong>Plaintiff:<\u002Fstrong> {{ docName }}<\u002Fdiv>\n          <div><strong>Contact:<\u002Fstrong> {{ docContact }}<\u002Fdiv>\n          <div style=\"margin-top:8px;\"><strong>Defendant:<\u002Fstrong> City of Santa Rosa, 100 Santa Rosa Ave, Santa Rosa, CA 95404<\u002Fdiv>\n          <div style=\"margin-top:8px;\"><strong>Amount claimed:<\u002Fstrong> {{ docAmount }}<\u002Fdiv>\n          <div style=\"margin:14px 0 6px; font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:0.06em; color:#17140f;\">Why the defendant owes me this money<\u002Fdiv>\n          <div style=\"white-space:pre-wrap;\">{{ docStatement }}<\u002Fdiv>\n          <div style=\"margin:14px 0 6px; font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:0.06em; color:#17140f;\">Legal basis<\u002Fdiv>\n          <div>{{ docBasis }}<\u002Fdiv>\n          <div style=\"margin-top:16px; border-top:2px dashed #b8b0a0; padding-top:12px; font-family:'Space Mono',monospace; font-size:11px; color:#7a715c;\">Filing fee $30–$75 (fee waiver CR-102 available). File at Sonoma County Superior Court. This draft is a starting point, not legal advice.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ MEDIA WATCH ============ -->\n  <sc-if value=\"{{ isMedia }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1200px; margin:0 auto; padding:34px 20px 80px;\">\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#17140f;\">Tool · Media watch<\u002Fdiv>\n    <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(30px,5vw,52px); line-height:0.95; text-transform:uppercase; margin:8px 0 6px;\">The news, scanned for us<\u002Fh1>\n    <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap; border:3px solid #17140f; background:#faf7ef; padding:12px 16px; margin:18px 0 22px;\">\n      <span style=\"display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700;\"><span style=\"width:9px; height:9px; border-radius:50%; background:#3f6b3a; display:inline-block;\"><\u002Fspan>Auto-scan: ON<\u002Fspan>\n      <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c;\">Sources: local + statewide homelessness, ADA, encampment &amp; court coverage<\u002Fspan>\n      <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c; margin-left:auto;\">Last run 4m ago · {{ mediaNewCount }} new hits<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:2px; background:#17140f; border:3px solid #17140f;\">\n      <sc-for list=\"{{ mediaFeed }}\" as=\"m\" hint-placeholder-count=\"5\">\n        <div style=\"background:#f3efe4; padding:18px 20px; display:grid; grid-template-columns:64px 1fr auto; gap:16px; align-items:start;\">\n          <div style=\"text-align:center; border:2px solid #17140f; padding:8px 4px; background:{{ m.scoreBg }};\">\n            <div style=\"font-family:'Anton',sans-serif; font-size:22px; line-height:0.9; color:{{ m.scoreFg }};\">{{ m.score }}<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:{{ m.scoreFg }};\">relevance<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#7a715c;\">{{ m.source }} · {{ m.date }}<\u002Fdiv>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:17px; line-height:1.15; margin:4px 0 6px;\">{{ m.headline }}<\u002Fdiv>\n            <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n              <sc-for list=\"{{ m.tags }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                <span style=\"font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; background:#17140f; color:#f3efe4; padding:2px 6px;\">{{ tg }}<\u002Fspan>\n              <\u002Fsc-for>\n              <span style=\"font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:2px 6px; border:2px solid #17140f; background:{{ m.statusBg }}; color:{{ m.statusFg }};\">{{ m.statusLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <button sc-camel-on-click=\"{{ m.flag }}\" style=\"cursor:pointer; border:2px solid #17140f; background:{{ m.flagBg }}; color:{{ m.flagFg }}; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:6px 10px;\">Flag<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ m.draft }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:7px 10px;\">Draft release<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ m.dismiss }}\" style=\"cursor:pointer; border:2px solid #b8b0a0; background:none; color:#7a715c; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:6px 10px;\">Dismiss<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ KNOW YOUR RIGHTS ============ -->\n  <sc-if value=\"{{ isRights }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:900px; margin:0 auto; padding:34px 20px 80px;\">\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#17140f;\">Know your rights<\u002Fdiv>\n    <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(34px,6vw,64px); line-height:0.92; text-transform:uppercase; margin:8px 0 12px;\">The City has rules now<\u002Fh1>\n    <p style=\"font-size:17px; line-height:1.6; color:#40382c; max-width:640px;\">The 2026 settlement in <em>Butterfly &amp; Homeless Action! v. City of Santa Rosa<\u002Fem> sets binding minimum standards for how the City treats your property during sweeps. These are your rights.<\u002Fp>\n    <div style=\"margin-top:30px; display:flex; flex-direction:column; gap:2px; background:#17140f; border:3px solid #17140f;\">\n      <sc-for list=\"{{ rights }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"background:#f3efe4; padding:22px 24px; display:grid; grid-template-columns:48px 1fr; gap:16px; align-items:start;\">\n          <div style=\"font-family:'Anton',sans-serif; font-size:32px; line-height:0.9; color:#17140f;\">§<\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:20px; line-height:1.1; text-transform:uppercase;\">{{ r.title }}<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.55; color:#4a4234; margin:8px 0 10px;\">{{ r.body }}<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:0.06em; color:#17140f;\">{{ r.clause }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px; display:flex; gap:12px; flex-wrap:wrap;\">\n      <button sc-camel-on-click=\"{{ goClaims }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; font-size:15px; padding:14px 22px; box-shadow:4px 4px 0 #17140f;\">They took your property? Sue them →<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goComplaint }}\" style=\"cursor:pointer; background:none; border:3px solid #17140f; font-weight:700; text-transform:uppercase; font-size:15px; padding:12px 20px; color:#17140f;\">Report a violation →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ADMIN LOGIN ============ -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:440px; margin:0 auto; padding:60px 20px 90px;\">\n    <div style=\"border:3px solid #17140f; background:#17140f; color:#f3efe4; padding:32px 28px; box-shadow:6px 6px 0 #f5c518;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#f5c518;\">🔒 Internal · officers only<\u002Fdiv>\n      <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:38px; line-height:0.95; text-transform:uppercase; margin:10px 0 8px;\">Officer log in<\u002Fh1>\n      <div style=\"font-size:14px; line-height:1.5; color:#c9c2b2; margin-bottom:20px;\">Union officers only. Ask an organizer for the access code.<\u002Fdiv>\n      <input type=\"text\" placeholder=\"Officer name\" style=\"width:100%; border:3px solid #f3efe4; background:#f3efe4; color:#17140f; padding:12px 14px; font-size:16px; margin-bottom:12px;\">\n      <input type=\"password\" value=\"union\" style=\"width:100%; border:3px solid #f3efe4; background:#f3efe4; color:#17140f; padding:12px 14px; font-size:16px; margin-bottom:20px;\">\n      <button sc-camel-on-click=\"{{ login }}\" style=\"width:100%; cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:18px; padding:18px;\">Enter the back end →<\u002Fbutton>\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; color:#b7b0a0; margin-top:14px; text-align:center;\">Demo — any code works · you stay logged in on this device<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ MEMBER PROFILE ============ -->\n  <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:960px; margin:0 auto; padding:28px 20px 80px;\">\n    <button sc-camel-on-click=\"{{ goDash }}\" style=\"background:none; border:none; cursor:pointer; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f; padding:0 0 16px;\">← Back to back end<\u002Fbutton>\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; color:#7a715c;\">{{ profile.id }} · {{ profile.type }}<\u002Fdiv>\n        <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(30px,5vw,50px); line-height:0.95; text-transform:uppercase; margin:6px 0 0;\">{{ profile.name }}<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <button sc-camel-on-click=\"{{ profileNewComplaint }}\" style=\"cursor:pointer; border:2px solid #17140f; background:none; font-weight:700; text-transform:uppercase; font-size:12px; padding:9px 14px; color:#17140f;\">+ Report<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ profileNewClaim }}\" style=\"cursor:pointer; border:2px solid #17140f; background:none; font-weight:700; text-transform:uppercase; font-size:12px; padding:9px 14px; color:#17140f;\">+ Small claim<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:2px; background:#17140f; border:3px solid #17140f; margin:18px 0;\">\n      <sc-for list=\"{{ profileInfo }}\" as=\"pi\" hint-placeholder-count=\"4\">\n        <div style=\"background:#f3efe4; padding:14px 16px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#7a715c;\">{{ pi.k }}<\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:600; margin-top:4px;\">{{ pi.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f; margin:8px 0 10px;\">Linked records · {{ profileCount }}<\u002Fdiv>\n    <div style=\"border:3px solid #17140f;\">\n      <sc-for list=\"{{ profileRecords }}\" as=\"pr\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ pr.onOpen }}\" style=\"display:grid; grid-template-columns:130px 1fr auto; gap:14px; align-items:center; padding:14px 16px; border-bottom:2px solid #17140f; cursor:pointer; background:{{ pr.bg }};\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; background:#17140f; color:#f3efe4; padding:5px 8px; text-align:center;\">{{ pr.typeLabel }}<\u002Fdiv>\n          <div><div style=\"font-weight:700; font-size:15px;\">{{ pr.id }}<\u002Fdiv><div style=\"font-size:13px; color:#4a4234; margin-top:2px;\">{{ pr.summary }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:5px 9px; border:2px solid #17140f; background:{{ pr.statusBg }};\">{{ pr.status }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ profileEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:30px; text-align:center; font-family:'Space Mono',monospace; font-size:13px; color:#7a715c;\">No linked records yet.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ADMIN BACKEND ============ -->\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1320px; margin:0 auto; padding:28px 20px 80px;\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#17140f;\">The back end · your data<\u002Fdiv>\n        <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(28px,4.5vw,48px); line-height:0.95; text-transform:uppercase; margin:6px 0 0;\">Union records<\u002Fh1>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ logout }}\" style=\"cursor:pointer; background:none; border:2px solid #17140f; font-weight:700; text-transform:uppercase; font-size:13px; padding:9px 15px; color:#17140f;\">Log out<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ adminFlash }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:3px solid #3f6b3a; background:#eaf3e8; padding:12px 16px; margin-top:16px; font-size:14px; font-weight:600; color:#254a20;\">✓ {{ adminFlash }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"border:3px solid #17140f; background:#17140f; color:#f3efe4; padding:16px 18px; margin:18px 0 20px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#f5c518; margin-bottom:12px;\">Assisted intake — fill out a workflow for a member<\u002Fdiv>\n      <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n        <sc-for list=\"{{ intakeLaunchers }}\" as=\"il\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ il.onClick }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; font-size:13px; padding:11px 16px;\">+ {{ il.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:2px; background:#17140f; border:3px solid #17140f; margin:0 0 20px;\">\n      <sc-for list=\"{{ adminStats }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"cursor:pointer; text-align:left; border:none; background:{{ d.bg }}; padding:16px 14px;\">\n          <div style=\"font-family:'Anton',sans-serif; font-size:32px; line-height:0.9; color:{{ d.color }};\">{{ d.num }}<\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#4a4234; margin-top:6px;\">{{ d.label }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:2px; flex-wrap:wrap; margin-bottom:16px; background:#17140f; border:3px solid #17140f;\">\n      <sc-for list=\"{{ adminTabs }}\" as=\"tb\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"cursor:pointer; border:none; font-family:'Space Mono',monospace; font-weight:700; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; padding:11px 14px; background:{{ tb.bg }}; color:{{ tb.fg }};\">{{ tb.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isPressTab }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:3px solid #17140f; background:#faf7ef; padding:20px; margin-bottom:18px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f; margin-bottom:12px;\">Compose &amp; publish a press release<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <input type=\"text\" name=\"title\" value=\"{{ press.title }}\" sc-camel-on-change=\"{{ onPress }}\" placeholder=\"Headline\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:16px; font-weight:700;\">\n        <textarea name=\"body\" value=\"{{ press.body }}\" sc-camel-on-change=\"{{ onPress }}\" rows=\"3\" placeholder=\"Body of the release…\" style=\"border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px; line-height:1.5;\"><\u002Ftextarea>\n        <div><button sc-camel-on-click=\"{{ publishPress }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; font-size:14px; padding:12px 20px; box-shadow:4px 4px 0 #17140f;\">Publish to site →<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isComplaintTab }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:3px solid #17140f; background:#faf7ef; padding:20px; margin-bottom:18px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f; margin-bottom:12px;\">Program a filing from the record<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n        <label style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:#40382c;\">Report record<\u002Fspan>\n          <sc-raw-select name=\"docRecord\" value=\"{{ docRecord }}\" sc-camel-on-change=\"{{ onDoc }}\" style=\"border:3px solid #17140f; background:#fff; padding:11px 12px; font-size:15px;\">\n            <sc-for list=\"{{ complaintChoices }}\" as=\"cc\" hint-placeholder-count=\"2\"><option value=\"{{ cc.value }}\">{{ cc.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:#40382c;\">Document type<\u002Fspan>\n          <sc-raw-select name=\"docType\" value=\"{{ docType }}\" sc-camel-on-change=\"{{ onDoc }}\" style=\"border:3px solid #17140f; background:#fff; padding:11px 12px; font-size:15px;\">\n            <sc-for list=\"{{ docTypeChoices }}\" as=\"dt\" hint-placeholder-count=\"3\"><option value=\"{{ dt }}\">{{ dt }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #17140f; background:#fffdf7; padding:20px; margin-top:14px; font-family:'Space Mono',monospace; font-size:12.5px; line-height:1.65; white-space:pre-wrap; max-height:320px; overflow:auto;\">{{ docPreview }}<\u002Fdiv>\n      <div style=\"margin-top:12px;\"><button sc-camel-on-click=\"{{ downloadFiling }}\" style=\"cursor:pointer; border:none; background:#17140f; color:#f3efe4; font-weight:800; text-transform:uppercase; font-size:13px; padding:11px 18px;\">↓ Download filing<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDataSourceTab }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:3px solid #17140f; background:#fffdf7; padding:22px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f;\">Where the union’s data lives<\u002Fdiv>\n      <h2 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(24px,4vw,38px); line-height:1; text-transform:uppercase; margin:8px 0 4px;\">Data source · Airtable<\u002Fh2>\n      <p style=\"font-size:14px; line-height:1.55; color:#4a4234; max-width:640px; margin:0 0 18px;\">By default every submission is saved on this device. Connect an Airtable base and it becomes the union’s shared record — linked tables, per-view sharing, and an API you can build on. The table and field map below is generated straight from the funnels, so your base matches 1:1.<\u002Fp>\n      <div style=\"display:inline-flex; align-items:center; gap:10px; border:3px solid #17140f; background:{{ dsSourceBg }}; padding:9px 14px; margin-bottom:18px;\">\n        <span style=\"width:10px; height:10px; border-radius:50%; background:{{ dsDot }}; display:inline-block;\"><\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700;\">Active source: {{ dataSourceLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:14px;\">\n        <label style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:#40382c;\">Airtable Base ID<\u002Fspan>\n          <input type=\"text\" name=\"baseId\" value=\"{{ airtable.baseId }}\" sc-camel-on-change=\"{{ onAirtable }}\" placeholder=\"appXXXXXXXXXXXXXX\" style=\"border:3px solid #17140f; background:#fff; padding:11px 13px; font-size:15px;\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:#40382c;\">Personal access token<\u002Fspan>\n          <input type=\"password\" name=\"pat\" value=\"{{ airtable.pat }}\" sc-camel-on-change=\"{{ onAirtable }}\" placeholder=\"patXXXXXXXXXXXXXX\" style=\"border:3px solid #17140f; background:#fff; padding:11px 13px; font-size:15px;\">\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center;\">\n        <sc-if value=\"{{ dsNotConnected }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ connectAirtable }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; font-size:14px; padding:12px 20px; box-shadow:4px 4px 0 #17140f;\">Connect base<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ airtable.connected }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ syncAirtable }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; font-size:14px; padding:12px 20px; box-shadow:4px 4px 0 #17140f;\">{{ syncLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ disconnectAirtable }}\" style=\"cursor:pointer; background:none; border:2px solid #17140f; font-weight:700; text-transform:uppercase; font-size:13px; padding:10px 16px; color:#17140f;\">Disconnect<\u002Fbutton>\n          <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c;\">{{ lastSyncLabel }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ dsMsg }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:3px solid #17140f; background:#fdf3cf; padding:11px 14px; margin-top:14px; font-size:13.5px; line-height:1.5;\">{{ airtable.msg }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#17140f; margin:24px 0 10px;\">Generated base schema · one table per funnel<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:2px; background:#17140f; border:3px solid #17140f;\">\n        <sc-for list=\"{{ airtableTables }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div style=\"background:#f3efe4; padding:14px 16px;\">\n            <div style=\"display:flex; justify-content:space-between; gap:10px; align-items:baseline;\">\n              <span style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; text-transform:uppercase;\">{{ t.table }}<\u002Fspan>\n              <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#7a715c;\">{{ t.count }} rows<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:11.5px; color:#4a4234; line-height:1.5; margin-top:5px;\">{{ t.fieldList }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c; margin-top:14px; line-height:1.6;\">Security note: an Airtable token should never live in a public web page. In the deployed union app a small serverless proxy holds the token and does the writing — this panel shows the exact table/field map and drives that sync.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTableTab }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border:3px solid #17140f; background:#fffdf7;\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 16px; border-bottom:3px solid #17140f; background:#17140f; color:#f3efe4;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase;\">{{ tableTitle }} · {{ tableCount }} rows<\u002Fdiv>\n        <div style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap;\">\n          <sc-if value=\"{{ isEditableTable }}\" hint-placeholder-val=\"{{ false }}\">\n            <input type=\"text\" value=\"{{ adminSearch }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search…\" style=\"border:2px solid #f3efe4; background:#f3efe4; color:#17140f; padding:6px 10px; font-family:'Space Mono',monospace; font-size:12px; width:180px;\">\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"cursor:pointer; border:2px solid #f3efe4; background:none; color:#f3efe4; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; padding:6px 12px;\">↓ Export CSV<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"srhu-scroll\" style=\"overflow-x:auto;\">\n        <sc-if value=\"{{ isEditableTable }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-raw-table style=\"border-collapse:collapse; width:100%; font-family:'Space Mono',monospace; font-size:12.5px; min-width:760px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-for list=\"{{ editCols }}\" as=\"col\" hint-placeholder-count=\"6\">\n              <sc-raw-th style=\"text-align:left; padding:10px 14px; border-bottom:2px solid #17140f; border-right:1px solid #e0d9c6; background:#efe9da; text-transform:uppercase; letter-spacing:0.04em; font-size:11px; white-space:nowrap; position:sticky; top:0;\">{{ col }}<\u002Fsc-raw-th>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ editRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <sc-raw-tr style=\"background:{{ row.bg }};\">\n                <sc-raw-td style=\"padding:8px 14px; border-bottom:1px solid #e0d9c6; border-right:1px solid #e0d9c6; vertical-align:top;\">\n                  <button sc-camel-on-click=\"{{ row.onOpen }}\" style=\"cursor:pointer; background:none; border:none; color:#17140f; font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; text-decoration:underline; padding:0;\">{{ row.id }}<\u002Fbutton>\n                <\u002Fsc-raw-td>\n                <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                  <sc-raw-td style=\"padding:8px 14px; border-bottom:1px solid #e0d9c6; border-right:1px solid #e0d9c6; vertical-align:top; max-width:260px;\">{{ cell.v }}<\u002Fsc-raw-td>\n                <\u002Fsc-for>\n                <sc-raw-td style=\"padding:6px 10px; border-bottom:1px solid #e0d9c6; border-right:1px solid #e0d9c6; vertical-align:top;\">\n                  <sc-raw-select value=\"{{ row.statusValue }}\" sc-camel-on-change=\"{{ row.onStatus }}\" style=\"border:2px solid #17140f; background:#f3efe4; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:5px 6px; text-transform:uppercase;\">\n                    <sc-for list=\"{{ row.statusOptions }}\" as=\"so\" hint-placeholder-count=\"3\"><option value=\"{{ so }}\">{{ so }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 14px; border-bottom:1px solid #e0d9c6; border-right:1px solid #e0d9c6; vertical-align:top; white-space:nowrap;\">{{ row.intake }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 14px; border-bottom:1px solid #e0d9c6; vertical-align:top; white-space:nowrap;\">{{ row.created }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isReadTable }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-raw-table style=\"border-collapse:collapse; width:100%; font-family:'Space Mono',monospace; font-size:12.5px; min-width:640px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-for list=\"{{ readCols }}\" as=\"col\" hint-placeholder-count=\"5\">\n              <sc-raw-th style=\"text-align:left; padding:10px 14px; border-bottom:2px solid #17140f; border-right:1px solid #e0d9c6; background:#efe9da; text-transform:uppercase; letter-spacing:0.04em; font-size:11px; white-space:nowrap; position:sticky; top:0;\">{{ col }}<\u002Fsc-raw-th>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ readRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <sc-raw-tr sc-camel-on-click=\"{{ row.onOpen }}\" style=\"background:{{ row.bg }}; cursor:{{ row.cursor }};\">\n                <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                  <sc-raw-td style=\"padding:9px 14px; border-bottom:1px solid #e0d9c6; border-right:1px solid #e0d9c6; vertical-align:top; max-width:280px;\">{{ cell }}<\u002Fsc-raw-td>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tableEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:40px; text-align:center; font-family:'Space Mono',monospace; font-size:13px; color:#7a715c;\">No rows yet. Submissions from the front-end funnels land here automatically.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Mono',monospace; font-size:12px; color:#7a715c; margin-top:14px; line-height:1.6;\">One dataset per workflow, one row per submission, editable status, CSV out — and filings are programmed straight from these fields. This shape maps 1:1 onto Airtable or a database with no rework.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ VOICE INTAKE MODAL ============ -->\n  <sc-if value=\"{{ voiceOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; z-index:80; background:rgba(23,20,15,0.72); display:flex; align-items:flex-start; justify-content:center; padding:24px; overflow:auto;\">\n    <div style=\"background:#f3efe4; border:3px solid #17140f; box-shadow:8px 8px 0 #c0201f; max-width:640px; width:100%; margin-top:20px;\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 20px; border-bottom:3px solid #17140f; background:#17140f; color:#f3efe4;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;\">Voice intake · {{ voiceStageLabel }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeVoice }}\" style=\"cursor:pointer; background:none; border:2px solid #f3efe4; color:#f3efe4; font-family:'Space Mono',monospace; font-size:12px; font-weight:700; padding:4px 10px;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:22px 20px;\">\n\n        <sc-if value=\"{{ isVoiceRecord }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"font-size:15px; line-height:1.55; color:#40382c; margin:0 0 16px;\">Speak your answer in your own language — English, Spanish, Tagalog, or Chinese. We’ll translate it and tidy it up, then show it to you to approve. Nothing is added or taken away.<\u002Fp>\n          <div style=\"text-align:center; padding:10px 0 6px;\">\n            <button sc-camel-on-click=\"{{ toggleRec }}\" style=\"cursor:pointer; width:88px; height:88px; border-radius:50%; border:3px solid #17140f; background:{{ recBtnBg }}; color:{{ recBtnFg }}; font-size:30px; box-shadow:4px 4px 0 #17140f;\">{{ recIcon }}<\u002Fbutton>\n            <div style=\"font-family:'Space Mono',monospace; font-size:13px; font-weight:700; margin-top:12px; color:#17140f;\">{{ recStatus }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#7a715c; line-height:1.5; margin:16px 0 8px; border-top:2px dashed #b8b0a0; padding-top:14px;\">Prototype note: live speech-to-text runs on the server in production. For now, type or paste what you said and we’ll translate + clean it.<\u002Fdiv>\n          <textarea value=\"{{ voiceRaw }}\" sc-camel-on-change=\"{{ onVoiceRaw }}\" rows=\"4\" placeholder=\"Type or paste what you said, in any language…\" style=\"width:100%; border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px; line-height:1.5;\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ processVoice }}\" style=\"margin-top:14px; cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:14px; padding:13px 20px; box-shadow:4px 4px 0 #17140f;\">Transcribe &amp; clean →<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isVoiceProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px 0;\">\n            <div style=\"font-family:'Anton',sans-serif; font-size:26px; text-transform:uppercase; color:#17140f; line-height:1; animation:srhuPulse 1.2s ease-in-out infinite;\">Working…<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:13px; line-height:2; color:#40382c; margin-top:14px;\">\n              <div>› Transcribing your recording<\u002Fdiv>\n              <div>› Detecting the language<\u002Fdiv>\n              <div>› Translating to English<\u002Fdiv>\n              <div>› Copy-editing for clarity — no facts changed<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isVoiceReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:3px solid #3f6b3a; background:#eaf3e8; padding:12px 14px; font-size:13px; line-height:1.5; color:#254a20; margin-bottom:16px;\"><strong>Faithfulness:<\u002Fstrong> {{ voiceNote }}<\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#7a715c;\">Detected language: {{ voiceLang }}<\u002Fdiv>\n          <div style=\"border:2px solid #b8b0a0; background:#faf7ef; padding:12px 14px; font-size:14px; line-height:1.5; color:#4a4234; margin:8px 0 16px; white-space:pre-wrap;\">{{ voiceRaw }}<\u002Fdiv>\n          <label style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#40382c;\">Cleaned English — read it, fix anything wrong:<\u002Fspan>\n            <textarea value=\"{{ voiceClean }}\" sc-camel-on-change=\"{{ onVoiceClean }}\" rows=\"6\" style=\"width:100%; border:3px solid #17140f; background:#fff; padding:12px 14px; font-size:15px; line-height:1.5;\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;\">\n            <button sc-camel-on-click=\"{{ approveVoice }}\" style=\"cursor:pointer; border:none; background:#f5c518; color:#17140f; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; font-size:14px; padding:13px 20px; box-shadow:4px 4px 0 #17140f;\">Approve &amp; insert<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ reRecord }}\" style=\"cursor:pointer; background:none; border:3px solid #17140f; font-weight:700; text-transform:uppercase; font-size:14px; padding:11px 18px; color:#17140f;\">Re-record<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#17140f; color:#e9e4d6; padding:40px 20px; border-top:4px solid #f5c518;\">\n    <div style=\"max-width:1240px; margin:0 auto; display:flex; gap:24px; justify-content:space-between; flex-wrap:wrap; align-items:flex-start;\">\n      <div style=\"max-width:340px;\">\n        <div style=\"font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase;\">Santa Rosa Homeless Union<\u002Fdiv>\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#f5c518; margin-top:4px;\">Landless · Not · Voiceless<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.6; color:#b7b0a0; margin-top:14px;\">A rank-and-file union of unhoused people in Santa Rosa. We organize, enforce the settlement, and defend each other during sweeps. An injury to one is an injury to all.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; line-height:2; color:#b7b0a0;\">\n        <div style=\"color:#f3efe4; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px;\">Legal backbone<\u002Fdiv>\n        <div>Butterfly v. City of Santa Rosa<\u002Fdiv>\n        <div>Case No. 18-CV-01955-VC (N.D. Cal.)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  DBKEY = 'srhu_db_v3';\n  LANGS = [ {code:'en',label:'English'}, {code:'es',label:'Español'}, {code:'tl',label:'Tagalog'}, {code:'zh',label:'中文'} ];\n  state = {\n    screen:'home', lang:'en', authed:false, adminTab:'action', adminSearch:'', adminFlash:'',\n    claimSaved:false, claimSavedId:'',\n    claim:{ name:'', contact:'', incidentDate:'', location:'', items:'', amount:'', narrative:'', b_property:false, b_notice:false, b_never:false, b_safekeep:false },\n    press:{ title:'', body:'' },\n    docRecord:'', docType:'CRD complaint',\n    activeFlow:null, flowMode:'public', flowStep:0, flowData:{}, doneId:'', doneWf:null,\n    profileId:'', profileName:'', currentPerson:null, chooserMode:'help',\n    voiceOpen:false, voiceKind:''  let airtable=this.state.airtable; try { const ra=localStorage.getItem('srhu_airtable'); if(ra) airtable={ ...airtable, ...JSON.parse(ra), busy:false, msg:'' }; } catch(_){}\n    if (!db) { db = this.seed(); this.persist(db); }\n    this.setState({ db, lang, currentPerson:person, authed, airtable });\n  }\n  persist(db){ try { localStorage.setItem(this.DBKEY, JSON.stringify(db)); } catch(e){} }\n  update(fn){ this.setState(s=>{ const db = fn(JSON.parse(JSON.stringify(s.db))); this.persist(db); return { db }; }); }\n\n  go(screen){ this.setState({ screen }); window.scrollTo(0,0); }\n  onField = (form) => (e) => { const el=e.target; const val=el.type==='checkbox'?el.checked:el.value; this.setState(s=>({ [form]:{ ...s[form], [el.name]:val } })); };\n  onFlow = (e) => { const el=e.target; const val=el.type==='checkbox'?el.checked:el.value; this.setState(s=>({ flowData:{ ...s.flowData, [el.name]:val } })); };\n  onDoc = (e) => { this.setState({ [e.target.name]: e.target.value }); };\n  onSearch = (e) => { this.setState({ adminSearch: e.target.value }); };\n\n  startFlow(id, mode, preset){ const p=this.state.currentPerson||{}; const seed={}; ['name','contact','location'].forEach(k=>{ if(p[k]) seed[k]=p[k]; }); if(preset) Object.assign(seed, preset); this.setState({ activeFlow:id, flowMode:mode, flowStep:0, flowData:seed, screen:'flow', adminFlash:'' }); window.scrollTo(0,0); }\n  openChooser(mode){ this.setState({ screen:'chooser', chooserMode:mode }); window.scrollTo(0,0); }\n\n  money(v){ const n=parseFloat(v); if(!n||n<0) return '$0.00'; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  today(){ return new Date().toISOString().slice(0,10); }\n  ago(dstr){ if(!dstr) return '\\u2014'; const d=new Date(dstr); if(isNaN(d)) return dstr; const days=Math.round((Date.now()-d.getTime())/86400000); if(days<=0) return 'today'; if(days===1) return 'yesterday'; if(days<7) return days+' days ago'; if(days<30) return Math.floor(days/7)+'w ago'; return Math.floor(days/30)+'mo ago'; }\n  jumpTab(tab, search){ this.setState({ adminTab:tab, adminSearch:search||'', adminFlash:'' }); window.scrollTo(0,0); }\n\n  // ---- Airtable data adapter ----\n  DATASETS = ['members','volunteers','complaints','sweeps','claims'];\n  airtableTables(){\n    const SC=this.schemas(); const env=['id','status','intake','created','memberId'];\n    const map=this.DATASETS.map(ds=>{\n      const sch=SC[ds];\n      const cols=[...env, ...sch.fields.filter(f=>f.type!=='derived').map(f=>f.name)];\n      if(ds==='sweeps') cols.push('compliant');\n      const uniq=[...new Set(cols)];\n      return { ds, table:'SRHU '+sch.label, count:(this.state.db&&this.state.db[ds]?this.state.db[ds].length:0), fields:uniq };\n    });\n    map.push({ ds:'press', table:'SRHU Press', count:(this.state.db&&this.state.db.press?this.state.db.press.length:0), fields:['id','date','title','body'] });\n    return map;\n  }\n  onAirtable=(e)=>{ const el=e.target; this.setState(s=>({ airtable:{ ...s.airtable, [el.name]:el.value } })); };\n  saveAirtable(extra){ this.setState(s=>{ const at={ ...s.airtable, ...(extra||{}) }; try{ localStorage.setItem('srhu_airtable', JSON.stringify({ baseId:at.baseId, pat:at.pat, connected:at.connected, lastSync:at.lastSync })); }catch(_){}; return { airtable:at }; }); }\n  connectAirtable=()=>{ const a=this.state.airtable; if(!a.baseId||!a.pat){ this.saveAirtable({ msg:'Enter both a Base ID and a personal access token.' }); return; } this.saveAirtable({ connected:true, msg:'Connected. Base '+a.baseId+' is now the union\\u2019s data source.' }); };\n  disconnectAirtable=()=>{ this.saveAirtable({ connected:false, msg:'Disconnected. Data stays on this device.' }); };\n  syncAirtable=async()=>{\n    const a=this.state.airtable; if(!a.connected) return;\n    this.setState(s=>({ airtable:{ ...s.airtable, busy:true, msg:'Syncing to Airtable\\u2026' } }));\n    const tables=this.airtableTables();\n    let ok=0, failed=0;\n    for(const t d, voiceName, voiceClean } = this.state;\n    if(voiceKind==='flow') this.setState(s=>({ flowData:{ ...s.flowData, [voiceName]:voiceClean } }));\n    else if(voiceKind==='claim') this.setState(s=>({ claim:{ ...s.claim, [voiceName]:voiceClean } }));\n    this.closeVoice();\n  };\n  processVoice = async () => {\n    if(this._recTimer) clearInterval(this._recTimer);\n    const raw = (this.state.voiceRaw||'').trim();\n    if(!raw) return;\n    this.setState({ voiceStage:'processing', voiceRecording:false });\n    const res = await this.runWhisper(raw);\n    this.setState({ voiceStage:'review', voiceClean:res.english, voiceLang:res.language, voiceNote:res.note });\n  };\n  runWhisper = async (text) => {\n    try {\n      if(window.claude && window.claude.complete){\n        const prompt = 'You are a careful intake editor for a homeless union. The input is a person\\u2019s own account of what happened to them; it may be in English, Spanish, Tagalog, or Chinese, and may be rough or spoken.\\n\\nDo ALL of the following:\\n1) Detect the language.\\n2) If it is not English, translate it faithfully to clear English.\\n3) Lightly copy-edit for grammar, spelling and flow so it reads clearly.\\n\\nCRITICAL RULES: Do NOT add, remove, infer, guess, or embellish ANY facts, names, dates, numbers, places, or claims. Only fix language and clarity. If something is unclear or incomplete, keep it that way \\u2014 do not invent details. Keep the person\\u2019s first-person voice.\\n\\nReturn ONLY valid JSON, no markdown, in this exact shape: {\"language\":\"<detected language>\",\"english\":\"<the cleaned English text>\",\"note\":\"<one short sentence describing what you changed, e.g. Translated from Spanish; grammar and spelling only; no facts changed>\"}\\n\\nText:\\n\"\"\"\\n' + text + '\\n\"\"\"';\n        const out = await window.claude.complete(prompt);\n        const m = out.match(/\\{[\\s\\S]*\\}/);\n        const obj = JSON.parse(m ? m[0] : out);\n        return { language: obj.language || 'Unknown', english: (obj.english||text).trim(), note: obj.note || 'Grammar and spelling only; no facts changed.' };\n      }\n    } catch(e){}\n    const cleaned = text.replace(/\\s+/g,' ').trim().replace(/^([a-z])/, (m,c)=>c.toUpperCase());\n    return { language:'English (assumed)', english: cleaned, note:'Basic cleanup only (AI editor unavailable in this preview) \\u2014 please review carefully.' };\n  };\n\n  buildStatement(c){\n    const items=c.items?c.items.trim():'my personal property';\n    const loc=c.location||'a public location in Santa Rosa';\n    const date=c.incidentDate||'the date of the sweep';\n    let s=`On ${date}, the City of Santa Rosa removed or destroyed ${items} that belonged to me at ${loc}.`;\n    if(c.narrative) s+=`\\n\\n${c.narrative.trim()}`;\n    s+=`\\n\\nThe City\\u2019s treatment of my property violated the binding settlement in Butterfly v. City of Santa Rosa (Case No. 18-CV-01955-VC). I am asking the court to order the City to pay me ${this.money(c.amount)} for the value of the property and my losses.`;\n    return s;\n  }\n  buildBasis(c){ const chosen=this.BASIS.filter(b=>c[b.key]); if(!chosen.length) return 'Fourth Amendment & California Constitution art. I \\u00a713; settlement in Butterfly v. City of Santa Rosa.'; return chosen.map(b=>`Settlement ${b.clause} \\u2014 ${b.label}`).join('; ')+'.'; }\n\n  buildFiling(r, type){\n    if(!r) return 'Select a report record to generate a filing.';\n    const who=`${r.name}${r.contact&&r.contact!=='\\u2014'?' ('+r.contact+')':''}`;\n    if(type==='CRD complaint') return ['CALIFORNIA CIVIL RIGHTS DEPARTMENT — INTAKE COMPLAINT (DRAFT)','',`Complainant: ${who}`,`Residence: ${r.location}`,`Respondent: ${r.respondent} [${r.respType}]`,`Date(s) of harm: ${r.incidentDate}   Location: ${r.incidentLocation}`,`Basis / protected activity: ${r.cats}`,'','STATEMENT OF THE COMPLAINT',r.narrative,'','HARM AND RELIEF SOUGHT',r.outcome,'',`Evidence & witnesses: ${r.evidence}`,'','Filed by the Santa Rosa Homeless Union on behalf of the complainant.','DRAFT — for review by counsel. Not legal advice.'].join('\\n');\n    if(type==='Demand letter') return [`${this.today()}`,'',`RE: Demand regarding ${r.respondent}`,'','To whom it may concern,','',`The Santa Rosa Homeless Union represents ${r.name} regarding conduct by ${r.respondent} on ${r.incidentDate} at ${r.incidentLocation}. Our member reports: ${r.narrative}`,'',`This implicates: ${r.cats}. We demand the following: ${r.outcome}`,'',`We request a written response within 15 days. Failure to respond will lead the Union to pursue all available remedies, including a complaint to the California Civil Rights Department and litigation.`,'','Sincerely,','Santa Rosa Homeless Union','DRAFT — not legal advice.'].join('\\n');\n    return ['SUPERIOR COURT OF CALIFORNIA, COUNTY OF SONOMA','',`${r.name}, Plaintiff,`,'   v.',`${r.respondent}, Defendant.`,'','STATEMENT OF FACTS',`1. On ${r.incidentDate}, at ${r.incidentLocation}, Defendant engaged in the conduct described below.`,`2. ${r.narrative}`,`3. This conduct constitutes: ${r.cats}.`,'','RELIEF REQUESTED',r.outcome,'','DRAFT caption & facts generated from the union record. For review by counsel.'].join('\\n');\n  }\n\n  csvEscape(v){ v=(v==null?'':String(v)); return /[\",\\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v; }\n  downloadText(name, text, mime){ try{ const blob=new Blob([text],{type:mime||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }catch(e){} }\n\n  openRecord(r){ const id = r.type==='members' ? r.id : (r.memberId||''); this.setState({ screen:'profile', profileId:id, profileName:r.name||'' }); window.scrollTo(0,0); }\n  updateStatus(ds, id, val){ this.update(dd=>{ dd[ds]=dd[ds].map(x=>x.id===id?{...x,status:val}:x); return dd; }); }\n\n  renderVals(){\n    const scr=this.state.screen;\n    const db=this.state.db || { members:[],vo
